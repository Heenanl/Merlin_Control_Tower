command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: MERLIN_CATALOG
    value: merlin_demo
  - name: MERLIN_SCHEMA
    value: merlin_demo
  # DEMO ONLY: remove (or set to "false") once a second approver (e.g. Michael) is in app_roles
  - name: MERLIN_ALLOW_SELF_APPROVAL
    value: "true"
  # Populated from the app's SQL warehouse resource (resource key: sql-warehouse)
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Lakebase (main config store). PGHOST/PGPORT/PGUSER are injected by the `postgres` resource;
  # LAKEBASE_ENDPOINT is the endpoint path used to mint OAuth credentials.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: MERLIN_PG_DATABASE
    value: merlin_demo
  # Read backend for browsers that have not used the UC / Lakebase toggle yet: uc or lakebase
  - name: MERLIN_DEFAULT_BACKEND
    value: lakebase
