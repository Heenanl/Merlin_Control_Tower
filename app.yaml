command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: MERLIN_CATALOG
    value: merlin_demo
  - name: MERLIN_SCHEMA
    value: merlin_demo
  # DEMO ONLY: remove (or set to "false") once a second approver (e.g. Michael) is in app_roles
  - name: MERLIN_ALLOW_SELF_APPROVAL
    value: "true"
  # Populated from the app's SQL warehouse resource (resource key: sql-warehouse)
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
